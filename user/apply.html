<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Apply | StarWave Audition</title>

    <link
        rel="stylesheet"
        href="../assets/css/user.css"
    >

</head>


<body>


<nav class="navbar">

    <a href="dashboard.html" class="logo">
        StarWave
    </a>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="auditions.html">
            Auditions
        </a>

        <a href="my-applications.html">
            My Applications
        </a>

        <a href="submissions.html">
            Submissions
        </a>

        <a href="results.html">
            Results
        </a>

        <a href="notifications.html">
            Notifications
        </a>

        <a href="profile.html">
            Profile
        </a>

    </div>

</nav>


<main class="page">

    <div class="container">

        <h1 class="page-title">
            Apply for Audition
        </h1>

        <p class="page-subtitle">
            Complete the form below to submit your application.
        </p>


        <div class="card">

            <form onsubmit="submitApplication(event)">


                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            value="Ankita Kamble"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            value="ankita@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Category
                        </label>

                        <select required>

                            <option value="">
                                Select Category
                            </option>

                            <option>
                                Vocal
                            </option>

                            <option>
                                Dance
                            </option>

                            <option>
                                Rap
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>
                            Performance Video
                        </label>

                        <input
                            type="file"
                            id="videoFile"
                            accept="video/*"
                            required
                            onchange="showFileName('videoFile','fileName')"
                        >

                        <small
                            id="fileName"
                            style="color:#888;"
                        >
                            No file selected
                        </small>

                    </div>


                    <div class="form-group full">

                        <label>
                            Tell us about yourself
                        </label>

                        <textarea
                            placeholder="Write a short introduction..."
                            required
                        ></textarea>

                    </div>


                </div>


                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="agree"
                        required
                    >

                    <label for="agree">
                        I confirm that the information provided
                        is correct and I agree to the audition terms.
                    </label>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Submit Application
                </button>


                <a
                    href="auditions.html"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>


            </form>

        </div>

    </div>

</main>


<footer>
    <p>© 2026 StarWave Audition. All Rights Reserved.</p>
</footer>


<script src="../assets/js/user.js"></script>


<script>

function submitApplication(event) {

    event.preventDefault();

    alert(
        "Application submitted successfully!"
    );

    window.location.href =
        "my-applications.html";

}

</script>


</body>
</html>
