
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | StarWave Audition</title>

    <link rel="stylesheet"
          href="../assets/css/user.css">

    <script src="../assets/js/user-auth-api.js"
            defer></script>
</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            StarWave
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Join StarWave and start your
            K-pop audition journey.
        </p>

        <form onsubmit="registerUser(event)">

            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    required>

            </div>


            <!-- DATE OF BIRTH -->

            <div class="form-group">

                <label for="dob">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                    required>

            </div>


            <!-- TERMS -->

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="terms"
                    required>

                <label for="terms">
                    I agree to the Terms & Conditions
                    and Privacy Policy.
                </label>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="btn btn-primary full-btn">

                Create Account

            </button>

        </form>


        <p class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="../index.html"
           class="back-home">

            ← Back to Home

        </a>

    </div>

</div>

</body>
</html>
