<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | StarWave Audition</title>

    <link rel="stylesheet" href="../assets/css/user.css">
    <script src="../assets/js/user-auth-api.js"></script>
</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            StarWave
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to continue your K-pop audition journey.
        </p>


        <form onsubmit="loginUser(event)">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="showPassword"
                    onchange="togglePassword('password', this)"
                >

                <label for="showPassword">
                    Show Password
                </label>

            </div>


            <button
                type="submit"
                class="btn btn-primary full-btn"
            >
                Login
            </button>

        </form>


        <p class="auth-bottom">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>


        <a
            href="../index.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>

</div>


<script src="../assets/js/user.js"></script>


<script>

function loginUser(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    if (email === "" || password === "") {

        alert("Please enter your email and password.");

        return;
    }


    /*
       Frontend demo only.

       Later, this login will connect
       to your Node.js + PostgreSQL backend.
    */

    alert("Login successful!");

    window.location.href = "dashboard.html";

}

</script>

</body>
</html>
