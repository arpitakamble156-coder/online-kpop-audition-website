
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | StarWave Audition</title>

    <link rel="stylesheet"
          href="../assets/css/user.css">

    <script src="../assets/js/user-auth-api.js"
            defer></script>
</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            StarWave
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to continue your
            K-pop audition journey.
        </p>


        <form onsubmit="loginUser(event)">

            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>


            <!-- SHOW PASSWORD -->

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="showPassword"
                    onchange="togglePassword('password', this)">

                <label for="showPassword">
                    Show Password
                </label>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-primary full-btn">

                Login

            </button>

        </form>


        <p class="auth-bottom">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>


        <a href="../index.html"
           class="back-home">

            ← Back to Home

        </a>

    </div>

</div>

</body>
</html>
