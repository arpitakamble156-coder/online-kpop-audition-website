<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Judge Profile | StarWave</title>

    <link
        rel="stylesheet"
        href="../assets/css/judge.css"
    >

</head>

<body>


<nav class="navbar">

    <a href="dashboard.html" class="logo">
        StarWave
    </a>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="assigned-auditions.html">
            Assigned Auditions
        </a>

        <a href="applicants.html">
            Applicants
        </a>

        <a href="evaluations.html">
            Evaluations
        </a>

        <a href="results.html">
            Results
        </a>

        <a
            href="profile.html"
            class="active"
        >
            Profile
        </a>

    </div>

</nav>


<main class="page">

    <div class="container">

        <h1 class="page-title">
            My Profile
        </h1>

        <p class="page-subtitle">
            Manage your judge account information.
        </p>


        <div class="card">

            <div class="profile-header">

                <div class="profile-avatar">
                    J
                </div>

                <div>

                    <h2>
                        Judge User
                    </h2>

                    <p style="color:#999;">
                        StarWave Evaluation Team
                    </p>

                </div>

            </div>


            <form onsubmit="updateJudgeProfile(event)">


                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            value="Judge User"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            value="judge@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Specialization
                        </label>

                        <select>

                            <option>
                                Vocal
                            </option>

                            <option>
                                Dance
                            </option>

                            <option>
                                Rap
                            </option>

                            <option>
                                All Categories
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Experience
                        </label>

                        <input
                            type="text"
                            placeholder="Years of experience"
                        >

                    </div>


                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>


            </form>

        </div>


        <div class="card">

            <h2 class="card-title">
                Account
            </h2>

            <p class="card-text">
                Sign out from your judge account.
            </p>

            <br>

            <button
                class="btn btn-danger"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>

</main>


<footer>

    <p>
        © 2026 StarWave Audition. All Rights Reserved.
    </p>

</footer>


<script src="../assets/js/judge.js"></script>


<script>

function updateJudgeProfile(event) {

    event.preventDefault();

    alert(
        "Judge profile updated successfully!"
    );

}

</script>


</body>
</html>
