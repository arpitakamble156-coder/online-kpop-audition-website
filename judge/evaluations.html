<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Evaluations | StarWave</title>

    <link
        rel="stylesheet"
        href="../assets/css/judge.css"
    >

</head>

<body>


<nav class="navbar">

    <a href="dashboard.html" class="logo">
        StarWave
    </a>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="assigned-auditions.html">
            Assigned Auditions
        </a>

        <a href="applicants.html">
            Applicants
        </a>

        <a
            href="evaluations.html"
            class="active"
        >
            Evaluations
        </a>

        <a href="results.html">
            Results
        </a>

        <a href="profile.html">
            Profile
        </a>

    </div>

</nav>


<main class="page">

    <div class="container">

        <h1 class="page-title">
            Applicant Evaluation
        </h1>

        <p class="page-subtitle">
            Evaluate the applicant's performance.
        </p>


        <div class="card">

            <h2 class="card-title">
                Ankita Kamble
            </h2>

            <p class="card-text">
                StarWave Global Audition — Vocal
            </p>

            <br>


            <form onsubmit="saveEvaluation(event)">


                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Vocal Skill
                        </label>

                        <select required>

                            <option value="">
                                Select Score
                            </option>

                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Technique
                        </label>

                        <select required>

                            <option value="">
                                Select Score
                            </option>

                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Stage Presence
                        </label>

                        <select required>

                            <option value="">
                                Select Score
                            </option>

                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Overall Performance
                        </label>

                        <select required>

                            <option value="">
                                Select Score
                            </option>

                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label>
                            Comments
                        </label>

                        <textarea
                            placeholder="Write your evaluation comments..."
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label>
                            Recommendation
                        </label>

                        <select required>

                            <option value="">
                                Select
                            </option>

                            <option>
                                Recommended
                            </option>

                            <option>
                                Maybe
                            </option>

                            <option>
                                Not Recommended
                            </option>

                        </select>

                    </div>


                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Evaluation
                </button>


            </form>

        </div>

    </div>

</main>


<footer>

    <p>
        © 2026 StarWave Audition. All Rights Reserved.
    </p>

</footer>


<script src="../assets/js/judge.js"></script>

</body>
</html>
